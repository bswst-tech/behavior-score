<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคะแนนพฤติกรรม — โรงเรียนบ้านสวนวิทยาคม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{
  --blue-50:#f0f8fc;--blue-100:#cbe8f2;--blue-200:#9dd1e6;
  --blue-400:#4dadd0;--blue-600:#2980b9;--blue-800:#1a5c85;
  --yellow-100:#fff6c3;--yellow-200:#ffe980;--yellow-800:#7a5c00;
  --red-100:#fde8e8;--red-600:#e53e3e;
  --green-100:#e1f5ee;--green-600:#1d6b45;
  --gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;
  --gray-600:#475569;--gray-800:#1e293b;
  --radius:10px;--shadow:0 2px 12px rgba(41,128,185,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--blue-50);color:var(--gray-800);min-height:100vh}
.topbar{background:var(--blue-600);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.chip-user{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:13px}
.nav-wrap{background:#fff;border-bottom:2px solid var(--blue-100);padding:0 1.5rem;position:sticky;top:56px;z-index:40;overflow-x:auto;white-space:nowrap}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:12px 16px;border:none;background:none;font-family:inherit;font-size:14px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.nav-btn:hover{color:var(--blue-600)}
.nav-btn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.container{padding:1.5rem;max-width:1100px;margin:0 auto}
@media(max-width:600px){.container{padding:1rem}}
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--blue-100);padding:1.25rem;box-shadow:var(--shadow)}
.card+.card{margin-top:1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:700px){.grid-4,.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
.stat-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--blue-100);padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si-blue{background:var(--blue-100);color:var(--blue-600)}
.si-yellow{background:var(--yellow-100);color:var(--yellow-800)}
.si-red{background:var(--red-100);color:var(--red-600)}
.si-green{background:var(--green-100);color:var(--green-600)}
.stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--gray-400);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);font-size:14px;font-family:inherit;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-800);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--gray-100)}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.btn-blue:hover{background:var(--blue-800)}
.btn-green{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.btn-green:hover{background:#155c37}
.btn-red{background:var(--red-600);color:#fff;border-color:var(--red-600)}
.btn-yellow{background:var(--yellow-100);color:var(--yellow-800);border-color:var(--yellow-200)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:.85rem}
.form-group label{font-size:13px;color:var(--gray-600);display:block;margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--blue-100);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(77,173,208,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
thead th{background:var(--blue-100);color:var(--blue-800);font-weight:600;padding:10px 12px;text-align:left;font-size:12px}
tbody tr{border-bottom:1px solid var(--blue-50)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--blue-50)}
td{padding:9px 12px;vertical-align:middle}
.td-actions{display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-blue{background:var(--blue-100);color:var(--blue-800)}
.badge-green{background:var(--green-100);color:var(--green-600)}
.badge-red{background:var(--red-100);color:var(--red-600)}
.badge-yellow{background:var(--yellow-100);color:var(--yellow-800)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}
.hist-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--blue-50)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dot-plus{background:var(--green-100);color:var(--green-600)}
.dot-minus{background:var(--red-100);color:var(--red-600)}
.pbar{height:8px;background:var(--blue-100);border-radius:4px;overflow:hidden;margin:6px 0}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s}
.search-box{position:relative}
.search-box i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:16px;pointer-events:none}
.search-box input{padding-left:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.chip{padding:5px 14px;border-radius:20px;font-size:13px;border:1.5px solid var(--blue-100);background:#fff;color:var(--gray-600);cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:var(--blue-100)}
.chip.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);font-weight:600}
.score-hero{font-size:64px;font-weight:700;line-height:1}
.score-good{color:var(--green-600)}
.score-mid{color:var(--yellow-800)}
.score-low{color:var(--red-600)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue-100) 0%,var(--yellow-100) 100%)}
.login-card{background:#fff;border-radius:16px;padding:2.25rem 2rem;width:340px;box-shadow:0 4px 24px rgba(41,128,185,.15);border:1.5px solid var(--blue-100)}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--blue-600);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:28px;color:#fff}
.role-tabs{display:flex;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--blue-100);margin-bottom:1.25rem}
.role-tab{flex:1;padding:9px;border:none;background:#fff;font-family:inherit;font-size:13px;color:var(--gray-600);cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px}
.role-tab:first-child{border-right:1.5px solid var(--blue-100)}
.role-tab.active{background:var(--blue-600);color:#fff;font-weight:600}
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--blue-100);margin-bottom:1rem;overflow-x:auto}
.tbtn{padding:8px 14px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tbtn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.tc{display:none}.tc.active{display:block}
.stu-hero{background:linear-gradient(135deg,var(--blue-600),var(--blue-800));border-radius:var(--radius);padding:1.5rem;color:#fff;display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.stu-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.loading{text-align:center;padding:2.5rem;color:var(--gray-400);font-size:14px}
.empty{text-align:center;padding:2.5rem;color:var(--gray-400);font-size:14px}
h2{font-size:17px;font-weight:600;margin-bottom:1rem}
h3{font-size:15px;font-weight:600;margin-bottom:.6rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
.text-muted{color:var(--gray-400);font-size:12px}
.img-preview{max-width:100%;max-height:180px;border-radius:8px;border:2px solid var(--blue-100);margin-top:.5rem;display:none}
.swal2-popup{font-family:'Sarabun',sans-serif!important;border-radius:14px!important}
.swal2-confirm,.swal2-cancel,.swal2-deny{border-radius:var(--radius)!important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i class="ti ti-star-filled"></i></div>
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:18px;font-weight:700">ระบบคะแนนพฤติกรรม</div>
      <div style="font-size:13px;color:var(--gray-400);margin-top:3px">โรงเรียนบ้านสวนวิทยาคม</div>
    </div>
    <div class="role-tabs">
      <button class="role-tab active" id="roleTeacher"><i class="ti ti-school" style="font-size:15px"></i> ครู</button>
      <button class="role-tab" id="roleStudent"><i class="ti ti-user" style="font-size:15px"></i> นักเรียน</button>
    </div>
    <div id="teacherArea">
      <div class="form-group"><label>ชื่อผู้ใช้</label><input id="loginUser" type="text" placeholder="username"></div>
      <div class="form-group"><label>รหัสผ่าน</label><input id="loginPass" type="password" placeholder="password"></div>
      <button class="btn btn-blue" style="width:100%" id="loginBtn">เข้าสู่ระบบ</button>
    </div>
    <div id="studentArea" style="display:none">
      <div style="background:var(--yellow-100);border:1.5px solid var(--yellow-200);border-radius:var(--radius);padding:.75rem 1rem;font-size:13px;color:var(--yellow-800);margin-bottom:1rem"><i class="ti ti-info-circle"></i> กรอกชื่อ-นามสกุลให้ตรงกับทะเบียน</div>
      <div class="form-group"><label>ห้องเรียน</label><select id="stuClass"><option value="">-- เลือกห้อง --</option></select></div>
      <div class="form-group"><label>ชื่อ-นามสกุล</label><input id="stuName" type="text" placeholder="เช่น กนกพร รักเรียน"></div>
      <button class="btn btn-blue" style="width:100%" id="stuBtn">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="topbar">
    <div class="topbar-brand"><div class="logo"><i class="ti ti-star-filled" style="font-size:16px"></i></div><span>ระบบคะแนนพฤติกรรม</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="chip-user" id="topUser"></span>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:transparent" onclick="doLogout()"><i class="ti ti-logout"></i> ออก</button>
    </div>
  </div>
  <div class="nav-wrap" id="mainNav"></div>
  <div id="pageArea"></div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, remove, onValue, child }
  from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrcxjvO4sit1iod6tT8QA5genjxjaKAMk",
  authDomain: "behavior-score-36b68.firebaseapp.com",
  databaseURL: "https://behavior-score-36b68-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "behavior-score-36b68",
  storageBucket: "behavior-score-36b68.firebasestorage.app",
  messagingSenderId: "967348590390",
  appId: "1:967348590390:web:c0f0135eb9b3f76bda0597"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── PRESETS ──
const PRESET_PLUS  = [{l:'จิตอาสา',v:10},{l:'เข้าร่วมกิจกรรมโรงเรียน',v:10}];
const PRESET_MINUS = [
  {l:'มาสาย',v:5},{l:'ขาดเรียน',v:5},{l:'โดดเรียน',v:5},
  {l:'ทรงผมผิดระเบียบ',v:5},{l:'แต่งกายผิดระเบียบ',v:5},
  {l:'สูบบุหรี่หรือบุหรี่ไฟฟ้า',v:30},{l:'ทะเลาะวิวาท',v:30}
];

// ── USERS (hardcoded — แก้ตรงนี้เพื่อเพิ่มครู) ──
const USERS = {
  teacher1 : { password:'1234',      role:'teacher', displayName:'ครูสุภลักษณ์' },
  teacher2 : { password:'1234',      role:'teacher', displayName:'ครูสมศรี' },
  admin    : { password:'admin2569', role:'admin',   displayName:'ผู้ดูแลระบบ' },
};

// ── STATE ──
let APP = { role:'', user:'', displayName:'', students:[], classes:[], stuData:null };
let _stype = 1, _imgB64 = '', _imgMime = '', _imgName = '';

// ── HELPERS ──
const $ = id => document.getElementById(id);
const makeId = (no, cls) => String(no).padStart(3,'0') + '_' + cls.replace(/[\/\s]/g,'');
const scoreCls = s => s>=80?'score-good':s>=60?'score-mid':'score-low';
const scoreBadge = s => {
  const c = s>=80?'badge-green':s>=60?'badge-yellow':'badge-red';
  return `<span class="badge ${c}">${s}</span>`;
};
const statusBadge = s => s>=80?'<span class="badge badge-green">ดี</span>':s>=60?'<span class="badge badge-yellow">ปานกลาง</span>':'<span class="badge badge-red">ต้องดูแล</span>';
const statusText = s => s>=80?'ดี':s>=60?'ปานกลาง':'ต้องดูแล';
const showPage = h => $('pageArea').innerHTML = h;
const toast = (icon,title,text='') => Swal.fire({icon,title,text,toast:true,position:'top-end',showConfirmButton:false,timer:3000,timerProgressBar:true});
const fmtDate = () => new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

// ── SETUP INITIAL DATA (รันครั้งแรกเท่านั้น) ──
async function setupInitialData() {
  const snap = await get(ref(db, 'setup_done'));
  if (snap.exists()) return;
  await set(ref(db, 'setup_done'), true);
}

// ── LOAD STUDENTS FROM FIREBASE ──
async function loadStudents() {
  const snap = await get(ref(db, 'students'));
  const students = [];
  if (snap.exists()) {
    snap.forEach(child => {
      students.push({ id: child.key, ...child.val() });
    });
  }
  APP.students = students.sort((a,b) => Number(a.no) - Number(b.no));
  APP.classes  = [...new Set(students.map(s => s.class))].sort();
  // โหลดห้องเรียนลง select นักเรียน
  const sel = $('stuClass');
  if (sel) {
    sel.innerHTML = '<option value="">-- เลือกห้อง --</option>';
    APP.classes.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  }
  return APP.students;
}

// ── LOGIN ──
let _loginRole = 'teacher';
function pickRole(r) {
  _loginRole = r;
  $('roleTeacher').classList.toggle('active', r==='teacher');
  $('roleStudent').classList.toggle('active', r==='student');
  $('teacherArea').style.display = r==='teacher' ? '' : 'none';
  $('studentArea').style.display = r==='student' ? '' : 'none';
}

function doLogin() {
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value.trim();
  if (!u||!p) { toast('warning','กรุณากรอกข้อมูลให้ครบ'); return; }
  const usr = USERS[u];
  if (!usr || usr.password !== p) {
    Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',confirmButtonColor:'#2980b9'});
    return;
  }
  APP.user = u; APP.displayName = usr.displayName; APP.role = usr.role;
  startApp();
}

async function doStudentLogin() {
  const cls  = $('stuClass').value;
  const name = $('stuName').value.trim();
  if (!cls||!name) { toast('warning','กรุณาเลือกห้องและกรอกชื่อ'); return; }
  $('stuBtn').disabled = true; $('stuBtn').textContent = 'กำลังตรวจสอบ...';
  await loadStudents();
  $('stuBtn').disabled = false; $('stuBtn').textContent = 'เข้าสู่ระบบ';
  const stu = APP.students.find(s => s.class===cls && s.name.trim()===name);
  if (!stu) { Swal.fire({icon:'error',title:'ไม่พบข้อมูล',text:'ไม่พบชื่อนักเรียนในระบบ กรุณาตรวจสอบการสะกดชื่อ',confirmButtonColor:'#2980b9'}); return; }
  APP.user = stu.id; APP.displayName = stu.name; APP.role = 'student'; APP.stuData = stu;
  startApp();
}

function doLogout() {
  APP = { role:'', user:'', displayName:'', students:[], classes:[], stuData:null };
  $('mainApp').style.display = 'none';
  $('loginScreen').style.display = 'flex';
}

// ── START APP ──
async function startApp() {
  $('loginScreen').style.display = 'none';
  $('mainApp').style.display = 'block';
  $('topUser').textContent = APP.displayName;
  if (APP.role==='teacher'||APP.role==='admin') {
    $('mainNav').innerHTML = [
      ['dash','ภาพรวม','ti-dashboard'],['students','นักเรียน','ti-users'],
      ['add-score','บันทึกคะแนน','ti-edit'],['history','ประวัติ','ti-history'],['report','รายงาน','ti-chart-bar']
    ].map((t,i) => `<button class="nav-btn${i===0?' active':''}" id="nav_${t[0]}" onclick="navTo('${t[0]}',this)"><i class="ti ${t[2]}"></i> ${t[1]}</button>`).join('');
    await loadStudents();
    renderDashboard();
  } else {
    $('mainNav').innerHTML = [
      ['my-score','คะแนนของฉัน','ti-star'],['my-history','ประวัติคะแนน','ti-history']
    ].map((t,i) => `<button class="nav-btn${i===0?' active':''}" id="nav_${t[0]}" onclick="navTo('${t[0]}',this)"><i class="ti ${t[2]}"></i> ${t[1]}</button>`).join('');
    renderMyScore();
  }
}

function navTo(page, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const map = {
    'dash': renderDashboard, 'students': () => renderStudents(''),
    'add-score': showAddScorePanel, 'history': loadHistory,
    'report': loadReport, 'my-score': renderMyScore,
    'my-history': () => loadStudentHistory(APP.user)
  };
  if(map[page]) map[page]();
}
window.navTo = navTo;

// ── DASHBOARD ──
async function renderDashboard() {
  showPage('<div class="container"><div class="loading"><i class="ti ti-loader"></i> กำลังโหลด...</div></div>');
  await loadStudents();
  const histSnap = await get(ref(db,'history'));
  const history = [];
  if (histSnap.exists()) histSnap.forEach(c => history.unshift({id:c.key,...c.val()}));

  const s = APP.students;
  const total = s.length;
  const avg = total ? Math.round(s.reduce((a,x)=>a+Number(x.score),0)/total) : 0;
  const above80 = s.filter(x=>x.score>=80).length;
  const below60 = s.filter(x=>x.score<60).length;

  let h = `<div class="container">
  <div class="section-header">

function collectForm() {
  const sid=$('fSid').value, delta=parseInt($('fDelta').value)||0, reason=$('fReason').value.trim(), note=$('fNote').value.trim();

async function doRecordScore(val) {
  const stu = APP.students.find(s=>s.id===val.sid);
  if(!stu){toast('error','ไม่พบนักเรียน');return}
  const newScore = Math.max(0, Math.min(100, Number(stu.score)+val.delta));
  const now = fmtDate();
  const histRef = push(ref(db,'history'));
  await Promise.all([
    set(ref(db,`students/${val.sid}/score`), newScore),
    set(histRef, { studentId:val.sid, name:stu.name, class:stu.class, delta:val.delta,
      type:val.delta>0?'เพิ่มคะแนน':'ตัดคะแนน', reason:val.reason, note:val.note||'', by:APP.displayName, ts:now, scoreAfter:newScore })
  ]);
  stu.score = newScore;
  toast('success','บันทึกสำเร็จ',`${val.delta>0?'+':''}${val.delta} คะแนน → ${newScore} คะแนน`);
  const nav = document.querySelector('.nav-btn.active'); if(nav) nav.click();
}

window.openEditHist = (histId, delta, reason, note) => {
  Swal.fire({
    title:'แก้ไขรายการ',
    html:`<div style="text-align:left">
      <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">คะแนน (+ได้รับ / -ถูกหัก)</label>
      <input id="eDelta" class="swal2-input" type="number" value="${delta}" style="font-family:Sarabun;width:100%;margin:0 0 10px">
      <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">เหตุผล</label>
      <input id="eReason" class="swal2-input" value="${reason}" style="font-family:Sarabun;width:100%;margin:0 0 10px">
      <label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">หมายเหตุ</label>
      <textarea id="eNote" class="swal2-textarea" style="font-family:Sarabun;width:100%;margin:0">${note}</textarea>
    </div>`,
    confirmButtonText:'บันทึกการแก้ไข',confirmButtonColor:'#2980b9',showCancelButton:true,cancelButtonText:'ยกเลิก',
    preConfirm: () => {
      const d=parseInt($('eDelta').value), r=$('eReason').value.trim();
      if(!r){Swal.showValidationMessage('กรุณาระบุเหตุผล');return false}
      return{delta:d,reason:r,note:$('eNote').value.trim()};
    }
  }).then(async r => {
    if(!r.isConfirmed) return;
    const snap = await get(ref(db,`history/${histId}`));
    if(!snap.exists()) return;
    const old = snap.val();
    const diff = r.value.delta - old.delta;
    await update(ref(db,`history/${histId}`), { delta:r.value.delta, reason:r.value.reason, note:r.value.note, type:r.value.delta>0?'เพิ่มคะแนน':'ตัดคะแนน' });
    if(diff!==0) {
      const stuSnap = await get(ref(db,`students/${old.studentId}/score`));
      const cur = stuSnap.exists()?Number(stuSnap.val()):100;
      await set(ref(db,`students/${old.studentId}/score`), Math.max(0,Math.min(100,cur+diff)));
      const stu = APP.students.find(s=>s.id===old.studentId); if(stu) stu.score=Math.max(0,Math.min(100,Number(stu.score)+diff));
    }
    toast('success','แก้ไขสำเร็จ'); loadHistory();
  });
};

window.deleteHist = async (histId, studentId, delta) => {
  const r = await Swal.fire({icon:'warning',title:'ยืนยันการลบ',text:'การลบจะคืนคะแนนให้นักเรียนอัตโนมัติ',confirmButtonText:'ลบรายการนี้',confirmButtonColor:'#e53e3e',showCancelButton:true,cancelButtonText:'ยกเลิก'});
  if(!r.isConfirmed) return;
  const stuSnap = await get(ref(db,`students/${studentId}/score`));
  const cur = stuSnap.exists()?Number(stuSnap.val()):100;
  await Promise.all([
    remove(ref(db,`history/${histId}`)),
    set(ref(db,`students/${studentId}/score`), Math.max(0,Math.min(100,cur-delta)))
  ]);
  const stu = APP.students.find(s=>s.id===studentId); if(stu) stu.score=Math.max(0,Math.min(100,Number(stu.score)-delta));
  toast('success','ลบสำเร็จ','คะแนนถูกคืนให้นักเรียนแล้ว'); loadHistory();
};

  showPage('<div class="container"><div class="loading">กำลังโหลด...</div></div>');
  await loadStudents();
  const classMap = {};
  APP.students.forEach(s => { if(!classMap[s.class]) classMap[s.class]=[]; classMap[s.class].push(s); });
  const report = Object.keys(classMap).sort().map(cls => {
    const list=classMap[cls];
    const avg=Math.round(list.reduce((a,x)=>a+Number(x.score),0)/list.length);
    return{cls,count:list.length,avg,above80:list.filter(s=>s.score>=80).length,above60:list.filter(s=>s.score>=60&&s.score<80).length,below60:list.filter(s=>s.score<60).length,students:list.sort((a,b)=>a.no-b.no)};
  });

  let h = `<div class="container">
  <div class="section-header"><h2 style="margin:0">รายงานสรุปคะแนนพฤติกรรม</h2>
    <div style="display:flex;gap:.5rem">
      <button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
      <button class="btn" onclick="window.print()"><i class="ti ti-printer"></i> พิมพ์</button>
    </div>
  </div>
  <div class="grid-3" style="margin-bottom:1.25rem">`;

  report.forEach(c => {
    const color=c.avg>=80?'var(--green-600)':c.avg>=60?'var(--yellow-800)':'var(--red-600)';
    h+=`<div class="card"><h3>${c.cls} <span class="badge badge-blue">${c.count} คน</span></h3>
    <div style="font-size:36px;font-weight:700;color:${color};margin-bottom:.25rem">${c.avg}</div>
    <div class="text-muted" style="margin-bottom:.5rem">คะแนนเฉลี่ย</div>
    <div class="pbar"><div class="pbar-fill" style="width:${c.avg}%;background:${color}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:.4rem">
      <span style="color:var(--green-600)">≥80: ${c.above80}</span>
      <span style="color:var(--yellow-800)">60-79: ${c.above60}</span>
      <span style="color:var(--red-600)">&lt;60: ${c.below60}</span>
    </div></div>`;
  });
  h += '</div><div class="card"><h3>รายละเอียดนักเรียน</h3><div class="tab-bar">';
  report.forEach((c,i) => h+=`<button class="tbtn${i===0?' active':''}" onclick="switchTab('tr_${c.cls.replace('/','_')}',this)">${c.cls}</button>`);
  h += '</div>';
  report.forEach((c,i) => {
    h+=`<div class="tc${i===0?' active':''}" id="tr_${c.cls.replace('/','_')}"><div class="table-wrap"><table>
    <thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>คะแนน</th><th>สถานะ</th></tr></thead><tbody>`;
    c.students.forEach(s=>h+=`<tr><td>${s.no}</td><td>${s.name}</td><td>${scoreBadge(Number(s.score))}</td><td>${statusBadge(Number(s.score))}</td></tr>`);
    h+='</tbody></table></div></div>';
  });
  h += '</div></div>';
  showPage(h);
};

window.switchTab = (id,btn) => {
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('.tc').forEach(t=>t.classList.remove('active')); $(id).classList.add('active');
};

window.exportCSV = async () => {
  await loadStudents();
  let csv = '\uFEFF' + 'ห้อง,เลขที่,ชื่อ-นามสกุล,คะแนน,สถานะ\n';
  APP.students.forEach(s => {
    const st = s.score>=80?'ดี':s.score>=60?'ปานกลาง':'ต้องดูแล';
    csv += `${s.class},${s.no},"${s.name}",${s.score},${st}\n`;
  });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download='คะแนนพฤติกรรม.csv'; a.click();
};

// ── STUDENT VIEW ──
function renderMyScore() {
  const stu = APP.stuData; if(!stu) return;
  const score = Number(stu.score);
  let h = `<div class="container">
  <div class="stu-hero">
    <div class="stu-avatar">${stu.name.charAt(0)}</div>
    <div><div style="font-size:17px;font-weight:700">${stu.name}</div><div style="opacity:.8;font-size:13px">${stu.class}</div></div>
    <div style="margin-left:auto;text-align:right"><div class="score-hero ${scoreCls(score)}" style="color:#fff">${score}</div><div style="font-size:12px;opacity:.7">/ 100 คะแนน</div></div>
  </div>
  <div class="grid-3" style="margin-bottom:1rem">
    <div class="stat-card"><div class="stat-icon si-blue"><i class="ti ti-award"></i></div><div><div class="stat-num ${scoreCls(score)}">${score}</div><div class="stat-label">คะแนนปัจจุบัน</div></div></div>
    <div class="stat-card"><div class="stat-icon ${score>=80?'si-green':score>=60?'si-yellow':'si-red'}"><i class="ti ti-mood-${score>=80?'happy':score>=60?'smile':'sad'}"></i></div><div><div class="stat-num" style="font-size:18px">${statusText(score)}</div><div class="stat-label">สถานะ</div></div></div>
    <div class="stat-card" style="background:var(--yellow-100);border-color:var(--yellow-200)"><div class="stat-icon si-yellow"><i class="ti ti-info-circle"></i></div><div><div style="font-size:13px;color:var(--yellow-800);font-weight:500">ภาคเรียนที่ 1/2569</div><div class="stat-label">คะแนนเต็ม 100</div></div></div>
  </div>
  <div class="card"><h3>ประวัติคะแนนล่าสุด</h3><div id="myHist"><div class="loading">กำลังโหลด...</div></div></div>
  </div>`;
  showPage(h);

  get(ref(db,'history')).then(snap => {
    const el=$('myHist'); if(!el) return;
    const hist=[];
    if(snap.exists()) snap.forEach(c=>{ if(c.val().studentId===stu.id) hist.unshift({id:c.key,...c.val()}); });
    if(!hist.length){el.innerHTML='<div class="empty">ยังไม่มีประวัติคะแนน</div>';return}
    el.innerHTML=hist.slice(0,10).map(hh=>`<div class="hist-item">
      <div class="hist-dot ${hh.delta>0?'dot-plus':'dot-minus'}">${hh.delta>0?'+'+hh.delta:hh.delta}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${hh.reason}</div>
      ${hh.note?`<div class="text-muted">${hh.note}</div>`:''}
      <div class="text-muted">${hh.ts} · ${hh.by}</div></div>
    </div>`).join('');
  });
}
window.renderMyScore = renderMyScore;

window.loadStudentHistory = async sid => {
  showPage('<div class="container"><div class="loading">กำลังโหลด...</div></div>');
  const snap = await get(ref(db,'history'));
  const hist=[];
  if(snap.exists()) snap.forEach(c=>{ if(c.val().studentId===sid) hist.unshift({id:c.key,...c.val()}); });
  let h='<div class="container"><h2>ประวัติคะแนนทั้งหมด</h2><div class="card">';
  if(!hist.length) h+='<div class="empty">ยังไม่มีประวัติ</div>';
  else hist.forEach(hh=>{ h+=`<div class="hist-item">
    <div class="hist-dot ${hh.delta>0?'dot-plus':'dot-minus'}">${hh.delta>0?'+'+hh.delta:hh.delta}</div>
    <div style="flex:1"><div style="font-size:13px;font-weight:600">${hh.reason}</div>
    ${hh.note?`<div class="text-muted">${hh.note}</div>`:''}
    <div class="text-muted">${hh.ts} · ${hh.by}</div></div>
    <div style="font-weight:700;color:${hh.delta>0?'var(--green-600)':'var(--red-600)'}">${hh.delta>0?'+':''}${hh.delta}</div>
  </div>`; });
  h+='</div></div>';
  showPage(h);
};

setupInitialData();
loadStudents();

document.getElementById('stuName').addEventListener('keypress', e => { if(e.key==='Enter') doStudentLogin(); });

document.getElementById('roleStudent').addEventListener('click', () => pickRole('student'));

</script>
