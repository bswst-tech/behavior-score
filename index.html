<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบคะแนนพฤติกรรม — โรงเรียนบ้านสวนวิทยาคม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --blue-50:#f0f8fc;--blue-100:#cbe8f2;--blue-200:#9dd1e6;
  --blue-400:#4dadd0;--blue-600:#2980b9;--blue-800:#1a5c85;
  --yellow-100:#fff6c3;--yellow-200:#ffe980;--yellow-800:#7a5c00;
  --red-100:#fde8e8;--red-600:#e53e3e;
  --green-100:#e1f5ee;--green-600:#1d6b45;
  --gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;
  --gray-600:#475569;--gray-800:#1e293b;
  --radius:10px;--shadow:0 2px 12px rgba(41,128,185,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--blue-50);color:var(--gray-800);min-height:100vh}
.topbar{background:var(--blue-600);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.chip-user{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:13px}
.nav-wrap{background:#fff;border-bottom:2px solid var(--blue-100);padding:0 1.5rem;position:sticky;top:56px;z-index:40;overflow-x:auto;white-space:nowrap}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:12px 16px;border:none;background:none;font-family:inherit;font-size:14px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.nav-btn:hover{color:var(--blue-600)}
.nav-btn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.container{padding:1.5rem;max-width:1100px;margin:0 auto}
@media(max-width:600px){.container{padding:1rem}}
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--blue-100);padding:1.25rem;box-shadow:var(--shadow)}
.card+.card{margin-top:1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:700px){.grid-4,.grid-3{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}
.stat-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--blue-100);padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si-blue{background:var(--blue-100);color:var(--blue-600)}
.si-yellow{background:var(--yellow-100);color:var(--yellow-800)}
.si-red{background:var(--red-100);color:var(--red-600)}
.si-green{background:var(--green-100);color:var(--green-600)}
.stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--gray-400);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);font-size:14px;font-family:inherit;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-800);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--gray-100)}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.btn-blue:hover{background:var(--blue-800)}
.btn-green{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.btn-green:hover{background:#155c37}
.btn-red{background:var(--red-600);color:#fff;border-color:var(--red-600)}
.btn-yellow{background:var(--yellow-100);color:var(--yellow-800);border-color:var(--yellow-200)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:.85rem}
.form-group label{font-size:13px;color:var(--gray-600);display:block;margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--blue-100);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(77,173,208,.15)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
thead th{background:var(--blue-100);color:var(--blue-800);font-weight:600;padding:10px 12px;text-align:left;font-size:12px}
tbody tr{border-bottom:1px solid var(--blue-50)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--blue-50)}
td{padding:9px 12px;vertical-align:middle}
.td-actions{display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-100);color:var(--green-600)}
.badge-red{background:var(--red-100);color:var(--red-600)}
.badge-yellow{background:var(--yellow-100);color:var(--yellow-800)}
.badge-blue{background:var(--blue-100);color:var(--blue-800)}
.hist-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--blue-50)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dot-plus{background:var(--green-100);color:var(--green-600)}
.dot-minus{background:var(--red-100);color:var(--red-600)}
.pbar{height:8px;background:var(--blue-100);border-radius:4px;overflow:hidden;margin:6px 0}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s}
.search-box{position:relative}
.search-box i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:16px;pointer-events:none}
.search-box input{padding-left:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.chip{padding:5px 14px;border-radius:20px;font-size:13px;border:1.5px solid var(--blue-100);background:#fff;color:var(--gray-600);cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{background:var(--blue-100)}
.chip.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);font-weight:600}
.score-hero{font-size:64px;font-weight:700;line-height:1}
.score-good{color:var(--green-600)}
.score-mid{color:var(--yellow-800)}
.score-low{color:var(--red-600)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue-100) 0%,var(--yellow-100) 100%)}
.login-card{background:#fff;border-radius:16px;padding:2.25rem 2rem;width:340px;box-shadow:0 4px 24px rgba(41,128,185,.15);border:1.5px solid var(--blue-100)}
.login-logo{width:64px;height:64px;border-radius:16px;background:var(--blue-600);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:28px;color:#fff}
.role-tabs{display:flex;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--blue-100);margin-bottom:1.25rem}
.role-tab{flex:1;padding:9px;border:none;background:#fff;font-family:inherit;font-size:13px;color:var(--gray-600);cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:5px}
.role-tab:first-child{border-right:1.5px solid var(--blue-100)}
.role-tab.active{background:var(--blue-600);color:#fff;font-weight:600}
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--blue-100);margin-bottom:1rem;overflow-x:auto}
.tbtn{padding:8px 14px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tbtn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.tc{display:none}.tc.active{display:block}
.stu-hero{background:linear-gradient(135deg,var(--blue-600),var(--blue-800));border-radius:var(--radius);padding:1.5rem;color:#fff;display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.stu-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.loading{text-align:center;padding:2.5rem;color:var(--gray-400);font-size:14px}
.empty{text-align:center;padding:2.5rem;color:var(--gray-400);font-size:14px}
h2{font-size:17px;font-weight:600;margin-bottom:1rem}
h3{font-size:15px;font-weight:600;margin-bottom:.6rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
.text-muted{color:var(--gray-400);font-size:12px}
.img-preview{max-width:100%;max-height:180px;border-radius:8px;border:2px solid var(--blue-100);margin-top:.5rem;display:none}
.swal2-popup{font-family:'Sarabun',sans-serif!important;border-radius:14px!important}
.swal2-confirm,.swal2-cancel,.swal2-deny{border-radius:var(--radius)!important}
/* class group cards */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1rem}
.class-card{background:#fff;border:1.5px solid var(--blue-100);border-radius:var(--radius);padding:1rem;text-align:center;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.class-card:hover{background:var(--blue-100);border-color:var(--blue-400);transform:translateY(-2px)}
.class-card .class-name{font-size:16px;font-weight:700;color:var(--blue-800);margin-bottom:4px}
.class-card .class-count{font-size:12px;color:var(--gray-400)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i class="ti ti-star-filled"></i></div>
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:18px;font-weight:700">ระบบคะแนนพฤติกรรม</div>
      <div style="font-size:13px;color:var(--gray-400);margin-top:3px">โรงเรียนบ้านสวนวิทยาคม</div>
    </div>
    <div class="role-tabs">
      <button class="role-tab active" id="roleTeacher"><i class="ti ti-school" style="font-size:15px"></i> ครู</button>
      <button class="role-tab" id="roleStudent"><i class="ti ti-user" style="font-size:15px"></i> นักเรียน</button>
    </div>
    <!-- ครู -->
    <div id="teacherArea">
      <div class="form-group"><label>ชื่อผู้ใช้</label><input id="loginUser" type="text" placeholder="username"></div>
      <div class="form-group"><label>รหัสผ่าน</label><input id="loginPass" type="password" placeholder="password"></div>
      <button class="btn btn-blue" style="width:100%" id="loginBtn">เข้าสู่ระบบ</button>
    </div>
    <!-- นักเรียน: เลือกชั้น → เลือกชื่อ -->
    <div id="studentArea" style="display:none">
      <div style="background:var(--yellow-100);border:1.5px solid var(--yellow-200);border-radius:var(--radius);padding:.75rem 1rem;font-size:13px;color:var(--yellow-800);margin-bottom:1rem">
        <i class="ti ti-info-circle"></i> เลือกชั้นเรียน แล้วเลือกชื่อของคุณ
      </div>
      <div class="form-group">
        <label>ชั้นเรียน</label>
        <select id="stuClass">
          <option value="">-- เลือกชั้นเรียน --</option>
        </select>
      </div>
      <div class="form-group" id="stuNameGroup" style="display:none">
        <label>ชื่อ-นามสกุล</label>
        <select id="stuNameSelect">
          <option value="">-- เลือกชื่อ --</option>
        </select>
      </div>
      <button class="btn btn-blue" style="width:100%" id="stuBtn">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" style="display:none">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo"><i class="ti ti-star-filled" style="font-size:16px"></i></div>
      <span>ระบบคะแนนพฤติกรรม</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="chip-user" id="topUser"></span>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border-color:transparent" id="logoutBtn"><i class="ti ti-logout"></i> ออก</button>
    </div>
  </div>
  <div class="nav-wrap" id="mainNav"></div>
  <div id="pageArea"></div>
</div>

<script>
// ── FIREBASE CONFIG ──
const firebaseConfig = {
  apiKey: "AIzaSyBrcxjvO4sit1iod6tT8QA5genjxjaKAMk",
  authDomain: "behavior-score-36b68.firebaseapp.com",
  databaseURL: "https://behavior-score-36b68-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "behavior-score-36b68",
  storageBucket: "behavior-score-36b68.firebasestorage.app",
  messagingSenderId: "967348590390",
  appId: "1:967348590390:web:c0f0135eb9b3f76bda0597"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// ── CONFIG ──
var PRESET_VOLUNTEER = [
  {l:'จิตอาสา',v:5},
  {l:'จิตอาสา',v:10},
  {l:'จิตอาสา',v:15},
  {l:'จิตอาสา',v:20},
  {l:'เข้าร่วมกิจกรรม',v:10},
];
var PRESET_IMPROVE = [
  {l:'ปรับพฤติกรรม',v:5},
  {l:'ปรับพฤติกรรม',v:10},
  {l:'ปรับพฤติกรรม',v:15},
  {l:'ปรับพฤติกรรม',v:20},
];
var PRESET_MINUS = [
  {l:'มาสาย',v:5},
  {l:'ขาดเรียน',v:5},
  {l:'โดดเรียน',v:10},
  {l:'ทรงผมผิดระเบียบ',v:5},
  {l:'แต่งกายผิดระเบียบ',v:5},
  {l:'สูบบุหรี่',v:20},
  {l:'สูบบุหรี่ไฟฟ้า',v:50},
  {l:'ทะเลาะวิวาท',v:20},
  {l:'ชู้สาว',v:20},
  {l:'ฝ่าฝืนกฎระเบียบอื่นๆ',v:5},
];
// ── เพิ่ม/แก้ไขครูได้ที่นี่ ──
var USERS = {
  teacher1: {password:'1234', role:'teacher', displayName:'ครูสุภลักษณ์'},
  teacher2: {password:'1234', role:'teacher', displayName:'ครูสมศรี'},
  admin:    {password:'admin2569', role:'admin', displayName:'ผู้ดูแลระบบ'},
};

// ── STATE ──
var APP = {role:'', user:'', displayName:'', students:[], classes:[], stuData:null};
var _stype = 1, _imgB64 = '', _imgMime = '', _imgName = '';

// ── HELPERS ──
function $(id){ return document.getElementById(id); }
function makeId(no, cls){ return String(no).padStart(3,'0') + '_' + cls.replace(/[\/\s\.]/g,''); }
function scoreCls(s){ return s>=80?'score-good':s>=60?'score-mid':'score-low'; }
function scoreBadge(s){
  var c = s>=80?'badge-green':s>=60?'badge-yellow':'badge-red';
  return '<span class="badge '+c+'">'+s+'</span>';
}
function volunteerBadge(v){
  return '<span class="badge badge-blue">⭐ '+v+'</span>';
}
function statusBadge(s){
  if(s>=80) return '<span class="badge badge-green">ดี</span>';
  if(s>=60) return '<span class="badge badge-yellow">ปานกลาง</span>';
  return '<span class="badge badge-red">ต้องดูแล</span>';
}
function statusText(s){ return s>=80?'ดี':s>=60?'ปานกลาง':'ต้องดูแล'; }
function showPage(h){ $('pageArea').innerHTML = h; }
function toast(icon, title, text){
  Swal.fire({icon:icon, title:title, text:text||'', toast:true, position:'top-end', showConfirmButton:false, timer:3000, timerProgressBar:true});
}
function fmtDate(){
  return new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ── LOAD STUDENTS ──
function loadStudents(callback){
  db.ref('students').once('value').then(function(snap){
    var students = [];
    if(snap.exists()){
      snap.forEach(function(child){
        var d = child.val();
        students.push({
          id:child.key, no:d.no, name:d.name, class:d.class,
          score:d.score !== undefined ? d.score : 100,      // คะแนนพฤติกรรม (0-100)
          volunteer:d.volunteer !== undefined ? d.volunteer : 0  // คะแนนจิตอาสา (สะสม)
        });
      });
    }
    students.sort(function(a,b){ return Number(a.no)-Number(b.no); });
    APP.students = students;
    APP.classes  = [...new Set(students.map(function(s){return s.class;}))].sort();
    if(callback) callback(students);
  });
}

// ── LOGIN ──
var _loginRole = 'teacher';

function pickRole(r){
  _loginRole = r;
  $('roleTeacher').classList.toggle('active', r==='teacher');
  $('roleStudent').classList.toggle('active', r==='student');
  $('teacherArea').style.display = r==='teacher' ? '' : 'none';
  $('studentArea').style.display = r==='student' ? '' : 'none';
  if(r==='student') populateClassSelect();
}

function populateClassSelect(){
  loadStudents(function(students){
    var classes = [...new Set(students.map(function(s){return s.class;}))].sort();
    var sel = $('stuClass');
    sel.innerHTML = '<option value="">-- เลือกชั้นเรียน --</option>';
    classes.forEach(function(c){
      var o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  });
}

// เมื่อเลือกชั้น → โหลดรายชื่อนักเรียนในชั้นนั้น
function onClassChange(){
  var cls = $('stuClass').value;
  var nameGroup = $('stuNameGroup');
  var nameSel   = $('stuNameSelect');
  if(!cls){ nameGroup.style.display='none'; return; }
  var list = APP.students.filter(function(s){return s.class===cls;});
  nameSel.innerHTML = '<option value="">-- เลือกชื่อ --</option>';
  list.forEach(function(s){
    var o = document.createElement('option');
    o.value = s.id; o.textContent = s.no + '. ' + s.name;
    nameSel.appendChild(o);
  });
  nameGroup.style.display = '';
}

function doLogin(){
  var u = $('loginUser').value.trim();
  var p = $('loginPass').value.trim();
  if(!u||!p){ toast('warning','กรุณากรอกข้อมูลให้ครบ'); return; }
  var usr = USERS[u];
  if(!usr || usr.password !== p){
    Swal.fire({icon:'error',title:'เข้าสู่ระบบไม่สำเร็จ',text:'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',confirmButtonColor:'#2980b9'});
    return;
  }
  APP.user = u; APP.displayName = usr.displayName; APP.role = usr.role;
  startApp();
}

function doStudentLogin(){
  var sid = $('stuNameSelect').value;
  if(!sid){ toast('warning','กรุณาเลือกชื่อของคุณ'); return; }
  var stu = APP.students.find(function(s){return s.id===sid;});
  if(!stu){ toast('error','ไม่พบข้อมูลนักเรียน'); return; }
  APP.user = stu.id; APP.displayName = stu.name; APP.role = 'student'; APP.stuData = stu;
  startApp();
}

function doLogout(){
  APP = {role:'', user:'', displayName:'', students:[], classes:[], stuData:null};
  $('mainApp').style.display = 'none';
  $('loginScreen').style.display = 'flex';
}

// ── START APP ──
function startApp(){
  $('loginScreen').style.display = 'none';
  $('mainApp').style.display = 'block';
  $('topUser').textContent = APP.displayName;
  if(APP.role==='teacher'||APP.role==='admin'){
    $('mainNav').innerHTML = [
      ['dash','ภาพรวม','ti-dashboard'],
      ['students','นักเรียน','ti-users'],
      ['add-score','บันทึกคะแนน','ti-edit'],
      ['history','ประวัติ','ti-history'],
      ['report','รายงาน','ti-chart-bar']
    ].map(function(t,i){
      return '<button class="nav-btn'+(i===0?' active':'')+'" onclick="navTo(\''+t[0]+'\',this)"><i class="ti '+t[2]+'"></i> '+t[1]+'</button>';
    }).join('');
    loadStudents(function(){ renderDashboard(); });
  } else {
    $('mainNav').innerHTML = [
      ['my-score','คะแนนของฉัน','ti-star'],
      ['my-history','ประวัติคะแนน','ti-history']
    ].map(function(t,i){
      return '<button class="nav-btn'+(i===0?' active':'')+'" onclick="navTo(\''+t[0]+'\',this)"><i class="ti '+t[2]+'"></i> '+t[1]+'</button>';
    }).join('');
    renderMyScore();
  }
}

function navTo(page, btn){
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  var map = {
    'dash': renderDashboard,
    'students': function(){ renderClassGroups(); },
    'add-score': showAddScorePanel,
    'history': loadHistory,
    'report': loadReport,
    'my-score': renderMyScore,
    'my-history': function(){ loadStudentHistory(APP.user); }
  };
  if(map[page]) map[page]();
}

// ── DASHBOARD ──
function renderDashboard(){
  showPage('<div class="container"><div class="loading"><i class="ti ti-loader"></i> กำลังโหลด...</div></div>');
  loadStudents(function(students){
    db.ref('history').once('value').then(function(snap){
      var history = [];
      if(snap.exists()) snap.forEach(function(c){ history.unshift({id:c.key, ...c.val()}); });

      var total   = students.length;
      var avg     = total ? Math.round(students.reduce(function(a,s){return a+Number(s.score);},0)/total) : 0;
      var above80 = students.filter(function(s){return s.score>=80;}).length;
      var below60 = students.filter(function(s){return s.score<60;}).length;

      var h = '<div class="container">';
      h += '<div class="section-header"><div><h2 style="margin:0">ภาพรวมคะแนนพฤติกรรม</h2><div class="text-muted">ภาคเรียนที่ 1 ปีการศึกษา 2569</div></div>';
      h += '<button class="btn btn-blue" onclick="showAddScorePanel()"><i class="ti ti-plus"></i> บันทึกคะแนน</button></div>';
      h += '<div class="grid-4" style="margin-bottom:1.25rem">';
      h += '<div class="stat-card"><div class="stat-icon si-blue"><i class="ti ti-users"></i></div><div><div class="stat-num">'+total+'</div><div class="stat-label">นักเรียนทั้งหมด</div></div></div>';
      h += '<div class="stat-card"><div class="stat-icon si-yellow"><i class="ti ti-star"></i></div><div><div class="stat-num">'+avg+'</div><div class="stat-label">คะแนนเฉลี่ย</div></div></div>';
      h += '<div class="stat-card"><div class="stat-icon si-green"><i class="ti ti-thumb-up"></i></div><div><div class="stat-num">'+above80+'</div><div class="stat-label">คะแนน ≥ 80</div></div></div>';
      h += '<div class="stat-card"><div class="stat-icon si-red"><i class="ti ti-alert-circle"></i></div><div><div class="stat-num">'+below60+'</div><div class="stat-label">คะแนน &lt; 60</div></div></div>';
      h += '</div><div class="grid-2">';

      // นักเรียนต้องดูแล
      var watch = students.filter(function(s){return s.score<60;});
      h += '<div class="card"><h3>นักเรียนที่ต้องดูแล <span class="badge badge-red">'+watch.length+'</span></h3>';
      if(!watch.length) h += '<div class="empty"><i class="ti ti-mood-happy" style="font-size:28px;color:var(--blue-200)"></i><br>ไม่มีนักเรียนคะแนนต่ำ</div>';
      else watch.forEach(function(st){
        h += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--blue-50)">';
        h += '<div><div style="font-weight:500;font-size:14px">'+st.name+'</div><div class="text-muted">'+st.class+'</div></div>';
        h += '<div style="display:flex;align-items:center;gap:8px">'+scoreBadge(Number(st.score))+'<button class="btn btn-sm btn-blue" onclick="openScoreModal(\''+st.id+'\')"><i class="ti ti-plus"></i></button></div></div>';
      });
      h += '</div>';

      // กิจกรรมล่าสุด
      h += '<div class="card"><h3>กิจกรรมล่าสุด</h3>';
      if(!history.length) h += '<div class="empty">ยังไม่มีการบันทึก</div>';
      else history.slice(0,7).forEach(function(hh){
        h += '<div class="hist-item"><div class="hist-dot '+(hh.delta>0?'dot-plus':'dot-minus')+'">'+(hh.delta>0?'+'+hh.delta:hh.delta)+'</div>';
        h += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+hh.name+'</div>';
        h += '<div class="text-muted">'+hh.reason+(hh.note?' · '+hh.note:'')+'</div></div>';
        h += '<div class="text-muted" style="white-space:nowrap;font-size:11px">'+((hh.ts||'').split(' ')[1]||'')+'</div></div>';
      });
      h += '</div></div></div>';
      showPage(h);
    });
  });
}

// ── STUDENTS — แสดงกลุ่มชั้นเรียนก่อน ──
function renderClassGroups(){
  loadStudents(function(students){
    var classMap = {};
    students.forEach(function(s){
      if(!classMap[s.class]) classMap[s.class]=[];
      classMap[s.class].push(s);
    });
    var classes = Object.keys(classMap).sort();

    var h = '<div class="container">';
    h += '<div class="section-header"><h2 style="margin:0">นักเรียนแยกตามชั้น</h2>';
    h += '<div style="display:flex;gap:.5rem">';
    h += '<button class="btn btn-yellow" onclick="openImportExcel()"><i class="ti ti-file-spreadsheet"></i> นำเข้า Excel</button>';
    h += '<button class="btn btn-blue" onclick="openAddStudentModal()"><i class="ti ti-user-plus"></i> เพิ่มนักเรียน</button>';
    h += '</div></div>';
    h += '<div class="class-grid">';
    classes.forEach(function(cls){
      var count = classMap[cls].length;
      var avg   = Math.round(classMap[cls].reduce(function(a,s){return a+Number(s.score);},0)/count);
      h += '<div class="class-card" onclick="renderStudentsByClass(\''+cls+'\')"><div class="class-name">'+cls+'</div>';
      h += '<div class="class-count">'+count+' คน · เฉลี่ย '+avg+'</div></div>';
    });
    h += '</div></div>';
    showPage(h);
  });
}

// แสดงรายชื่อนักเรียนในชั้นที่เลือก

// ── SCORE FORM ──

  sid = sid || '';

  var selCls = selStu ? selStu.class : '';
  var clsOpts = APP.classes.map(function(c){
    return '<option value="'+c+'"'+(c===selCls?' selected':'')+'>'+c+'</option>';
  }).join('');
  var stuOpts = selCls ? APP.students.filter(function(s){return s.class===selCls;}).map(function(s){
    return '<option value="'+s.id+'"'+(s.id===sid?' selected':'')+'>'+s.no+'. '+s.name+'</option>';
  }).join('') : '';

  return '<div style="text-align:left">'
    +'<div class="form-group"><label>ชั้นเรียน</label>'
    +'<select id="fCls" style="font-family:Sarabun" onchange="onScoreClassChange()">'
    +'<option value="">-- เลือกชั้นเรียน --</option>'+clsOpts
    +'</select></div>'
    +'<div class="form-group" id="fSidGroup" style="'+(selCls?'':'display:none')+'"><label>นักเรียน</label>'
    +'<select id="fSid" style="font-family:Sarabun"><option value="">-- เลือกนักเรียน --</option>'+stuOpts+'</select></div>'
    +'<div class="form-group"><label>ประเภท</label>'
    +'<div style="display:flex;gap:.5rem;flex-wrap:wrap">'
    +'<button type="button" id="fBtnVol" class="btn btn-green" style="flex:1;min-width:120px" onclick="setSType(\'vol\')"><i class="ti ti-heart"></i> จิตอาสา</button>'
    +'<button type="button" id="fBtnImp" class="btn" style="flex:1;min-width:120px;color:var(--blue-600);border-color:var(--blue-200)" onclick="setSType(\'imp\')"><i class="ti ti-refresh"></i> ปรับพฤติกรรม</button>'
    +'<button type="button" id="fBtnMin" class="btn" style="flex:1;min-width:120px;color:var(--red-600);border-color:var(--red-100)" onclick="setSType(\'min\')"><i class="ti ti-minus"></i> ตัดคะแนน</button>'
    +'</div></div>'
    +'<div class="form-group"><label>เหตุผลด่วน</label>'
    +'<div id="fPresets" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:4px">'
    +PRESET_VOLUNTEER.map(function(p){return '<button type="button" class="chip" onclick="pickPreset(\''+p.l+'\','+p.v+')">'+p.l+' (+'+p.v+')</button>';}).join('')
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem">'
    +'<div><label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">คะแนน</label><input id="fDelta" type="number" value="1" min="1" max="100" style="font-family:Sarabun"></div>'
    +'<div><label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">เหตุผล</label><input id="fReason" type="text" placeholder="ระบุเหตุผล" style="font-family:Sarabun"></div>'
    +'</div>'
    +'<div class="form-group"><label>หมายเหตุ (ไม่บังคับ)</label><textarea id="fNote" rows="2" style="font-family:Sarabun" placeholder="รายละเอียดเพิ่มเติม..."></textarea></div>'
    +'</div>';
}

function onScoreClassChange(){
  var cls = document.getElementById('fCls').value;
  var grp = document.getElementById('fSidGroup');
  var sel = document.getElementById('fSid');
  if(!cls){ grp.style.display='none'; return; }
  var list = APP.students.filter(function(s){return s.class===cls;});
  sel.innerHTML = '<option value="">-- เลือกนักเรียน --</option>'
    + list.map(function(s){return '<option value="'+s.id+'">'+s.no+'. '+s.name+'</option>';}).join('');
  grp.style.display = '';
}

function setSType(t){
  _stype = t;
  var bv = document.getElementById('fBtnVol');
  var bi = document.getElementById('fBtnImp');
  var bm = document.getElementById('fBtnMin');
  if(!bv||!bi||!bm) return;

  // reset all
  bv.className='btn'; bv.style.cssText='flex:1;min-width:120px;color:var(--green-600);border-color:var(--green-100)';
  bi.className='btn'; bi.style.cssText='flex:1;min-width:120px;color:var(--blue-600);border-color:var(--blue-200)';
  bm.className='btn'; bm.style.cssText='flex:1;min-width:120px;color:var(--red-600);border-color:var(--red-100)';

  var presets = [];
  if(t==='vol'){
    bv.className='btn btn-green'; bv.style.cssText='flex:1;min-width:120px';
    presets = PRESET_VOLUNTEER;
  } else if(t==='imp'){
    bi.className='btn btn-blue'; bi.style.cssText='flex:1;min-width:120px';
    presets = PRESET_IMPROVE;
  } else {
    bm.className='btn btn-red'; bm.style.cssText='flex:1;min-width:120px';
    presets = PRESET_MINUS;
  }

  var sign = t==='min' ? '-' : '+';
  document.getElementById('fPresets').innerHTML = presets.map(function(p){
    return '<button type="button" class="chip" onclick="pickPreset(\''+p.l+'\','+p.v+')">'+p.l+' ('+sign+p.v+')</button>';
  }).join('');
}

function pickPreset(l, v){
  var fr = document.getElementById('fReason'); if(fr) fr.value = l;
  var fd = document.getElementById('fDelta');  if(fd) fd.value = v;
}

function collectForm(){
  var sidEl  = document.getElementById('fSid');
  var sid    = sidEl ? sidEl.value : '';
  var delta  = parseInt(document.getElementById('fDelta').value) || 0;
  var reason = document.getElementById('fReason').value.trim();
  var note   = document.getElementById('fNote').value.trim();
  if(!sid)    { Swal.showValidationMessage('กรุณาเลือกนักเรียน'); return false; }
  if(!reason) { Swal.showValidationMessage('กรุณาระบุเหตุผล'); return false; }
  if(delta<=0){ Swal.showValidationMessage('กรุณาระบุจำนวนคะแนน'); return false; }
  var actualDelta = _stype==='min' ? -delta : delta;
  var typeName = _stype==='vol' ? 'จิตอาสา' : _stype==='imp' ? 'ปรับพฤติกรรม' : 'ตัดคะแนน';
  return {sid:sid, delta:actualDelta, reason:reason, note:note, typeName:typeName};
}

function showAddScorePanel(){
  _stype='vol';
  showPage('<div class="container">'
    +'<div class="section-header"><h2 style="margin:0">บันทึกคะแนนพฤติกรรม</h2></div>'
    +'<div class="card">'+buildScoreForm()
    +'<div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">'
    +'<button class="btn btn-green" onclick="submitFromPanel()"><i class="ti ti-check"></i> บันทึก</button>'
    +'</div></div></div>');
}

function submitFromPanel(){
  var val = collectForm(); if(!val) return;
  doRecordScore(val);
}

function openScoreModal(sid){
  _stype='vol';
  Swal.fire({
    title:'บันทึกคะแนนพฤติกรรม',
    html: buildScoreForm(sid||''),
    width:540,
    confirmButtonText:'<i class="ti ti-check"></i> บันทึก',
    confirmButtonColor:'#2980b9',
    showCancelButton:true,
    cancelButtonText:'ยกเลิก',
    preConfirm:function(){ return collectForm(); }
  }).then(function(r){ if(r.isConfirmed && r.value) doRecordScore(r.value); });
}

function doRecordScore(val){
  var stu = APP.students.find(function(s){return s.id===val.sid;});
  if(!stu){ toast('error','ไม่พบนักเรียน'); return; }

  var updates = {};
  var newBehavior = Number(stu.score);
  var newVolunteer = Number(stu.volunteer||0);
  var now = fmtDate();

  if(val.typeName==='จิตอาสา'){
    // คะแนนจิตอาสา — สะสมไม่มีขีดจำกัด
    newVolunteer = newVolunteer + val.delta;
    updates['students/'+val.sid+'/volunteer'] = newVolunteer;
  } else {
    // คะแนนพฤติกรรม — อยู่ใน 0-100
    newBehavior = Math.max(0, Math.min(100, newBehavior + val.delta));
    updates['students/'+val.sid+'/score'] = newBehavior;
  }

  db.ref().update(updates).then(function(){
    var histRef = db.ref('history').push();
    return histRef.set({
      studentId:val.sid, name:stu.name, class:stu.class,
      delta:val.delta, type:val.typeName,
      scoreType: val.typeName==='จิตอาสา' ? 'volunteer' : 'behavior',
      reason:val.reason, note:val.note||'', by:APP.displayName,
      ts:now,
      scoreAfter: val.typeName==='จิตอาสา' ? newVolunteer : newBehavior
    });
  }).then(function(){
    stu.score = newBehavior;
    stu.volunteer = newVolunteer;
    var msg = val.typeName==='จิตอาสา'
      ? ('+'+val.delta+' คะแนนจิตอาสา → '+newVolunteer+' คะแนน')
      : ((val.delta>0?'+':'')+val.delta+' คะแนนพฤติกรรม → '+newBehavior+' คะแนน');
    toast('success','บันทึกสำเร็จ', msg);
    var active = document.querySelector('.nav-btn.active');
    if(active) active.click();
  }).catch(function(e){ toast('error','เกิดข้อผิดพลาด',e.message); });
}

// ── HISTORY ──

  db.ref('history').once('value').then(function(snap){
    var hist = [];
    if(snap.exists()) snap.forEach(function(c){ hist.unshift({id:c.key, ...c.val()}); });
    var h = '<div class="container">';
    h += '<div class="section-header"><h2 style="margin:0">ประวัติการบันทึกคะแนน</h2>';
    h += '<div style="display:flex;gap:.5rem">';
    h += '<button class="btn" onclick="filterHist(\'plus\')"><i class="ti ti-arrow-up" style="color:var(--green-600)"></i> เพิ่มคะแนน</button>';
    h += '<button class="btn" onclick="filterHist(\'minus\')"><i class="ti ti-arrow-down" style="color:var(--red-600)"></i> ตัดคะแนน</button>';
    h += '<button class="btn" onclick="filterHist(\'\')"><i class="ti ti-list"></i> ทั้งหมด</button>';
    h += '</div></div>';
    h += '<div class="search-box" style="margin-bottom:1rem"><i class="ti ti-search"></i><input id="histSearch" placeholder="ค้นหา..." oninput="filterHistSearch()"></div>';

    if(!hist.length) h += '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--gray-400)">ยังไม่มีประวัติ</td></tr>';
    else hist.forEach(function(hh){
      var plus = hh.delta > 0;
      h += '<tr data-type="'+(plus?'plus':'minus')+'">';
      h += '<td style="white-space:nowrap;font-size:12px">'+hh.ts+'</td>';
      h += '<td style="font-weight:500">'+hh.name+'</td><td>'+hh.class+'</td>';
      var typeBadge = hh.type==='จิตอาสา'
        ? '<span class="badge badge-blue">⭐ จิตอาสา</span>'
        : hh.type==='ปรับพฤติกรรม'
          ? '<span class="badge badge-blue">🔄 ปรับพฤติกรรม</span>'
          : plus ? '<span class="badge badge-green">เพิ่มคะแนน</span>' : '<span class="badge badge-red">ตัดคะแนน</span>';
      h += '<td>'+typeBadge+'</td>';
      h += '<td><span style="font-weight:700;color:'+(plus?'var(--green-600)':'var(--red-600)')+'">'+(plus?'+':'')+hh.delta+'</span></td>';
      h += '<td>'+hh.reason+'</td>';
      h += '<td style="font-size:12px">'+hh.by+'</td>';
      h += '<td><div class="td-actions">';
      h += '<button class="btn btn-sm" title="แก้ไข" onclick="openEditHist(\''+hh.id+'\','+hh.delta+',\''+escq(hh.reason)+'\',\''+escq(hh.note||'')+'\')"><i class="ti ti-edit"></i></button>';
      h += '<button class="btn btn-sm" style="color:var(--red-600);border-color:var(--red-100)" title="ลบ" onclick="deleteHist(\''+hh.id+'\',\''+hh.studentId+'\','+hh.delta+')"><i class="ti ti-trash"></i></button>';
      h += '</div></td></tr>';
    });
    h += '</tbody></table></div></div></div>';

function escq(s){ return (s||'').replace(/'/g,"\\'"); }
function filterHist(type){
  document.querySelectorAll('#histTbl tbody tr').forEach(function(r){
    r.style.display = (!type || r.dataset.type===type) ? '' : 'none';
  });
}
function filterHistSearch(){
  var q = $('histSearch').value.toLowerCase();
  document.querySelectorAll('#histTbl tbody tr').forEach(function(r){
    r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function openEditHist(histId, delta, reason, note){
  Swal.fire({
    title:'แก้ไขรายการ',
    html:'<div style="text-align:left">'
      +'<label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">คะแนน (+ได้รับ / -ถูกหัก)</label>'
      +'<input id="eDelta" class="swal2-input" type="number" value="'+delta+'" style="font-family:Sarabun;width:100%;margin:0 0 10px">'
      +'<label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">เหตุผล</label>'
      +'<input id="eReason" class="swal2-input" value="'+reason+'" style="font-family:Sarabun;width:100%;margin:0 0 10px">'
      +'<label style="font-size:13px;font-weight:500;display:block;margin-bottom:4px">หมายเหตุ</label>'
      +'<textarea id="eNote" class="swal2-textarea" style="font-family:Sarabun;width:100%;margin:0">'+note+'</textarea>'
      +'</div>',
    confirmButtonText:'บันทึกการแก้ไข', confirmButtonColor:'#2980b9',
    showCancelButton:true, cancelButtonText:'ยกเลิก',
    preConfirm:function(){
      var d = parseInt(document.getElementById('eDelta').value);
      var r = document.getElementById('eReason').value.trim();
      if(!r){ Swal.showValidationMessage('กรุณาระบุเหตุผล'); return false; }
      return {delta:d, reason:r, note:document.getElementById('eNote').value.trim()};
    }
  }).then(function(r){
    if(!r.isConfirmed) return;
    db.ref('history/'+histId).once('value').then(function(snap){
      if(!snap.exists()) return;
      var old  = snap.val();
      var diff = r.value.delta - old.delta;
      db.ref('history/'+histId).update({delta:r.value.delta, reason:r.value.reason, note:r.value.note, type:r.value.delta>0?'เพิ่มคะแนน':'ตัดคะแนน'}).then(function(){
        if(diff!==0){
          db.ref('students/'+old.studentId+'/score').once('value').then(function(s){
            var cur = s.exists() ? Number(s.val()) : 100;
            db.ref('students/'+old.studentId+'/score').set(Math.max(0,Math.min(100,cur+diff)));
            var stu = APP.students.find(function(x){return x.id===old.studentId;});
            if(stu) stu.score = Math.max(0,Math.min(100,Number(stu.score)+diff));
          });
        }
        toast('success','แก้ไขสำเร็จ',''); loadHistory();
      });
    });
  });
}

function deleteHist(histId, studentId, delta){
  Swal.fire({
    icon:'warning', title:'ยืนยันการลบ', text:'การลบจะคืนคะแนนให้นักเรียนอัตโนมัติ',
    confirmButtonText:'ลบรายการนี้', confirmButtonColor:'#e53e3e',
    showCancelButton:true, cancelButtonText:'ยกเลิก'
  }).then(function(r){
    if(!r.isConfirmed) return;
    db.ref('students/'+studentId+'/score').once('value').then(function(s){
      var cur = s.exists() ? Number(s.val()) : 100;
      db.ref('students/'+studentId+'/score').set(Math.max(0,Math.min(100,cur-delta)));
      var stu = APP.students.find(function(x){return x.id===studentId;});
      if(stu) stu.score = Math.max(0,Math.min(100,Number(stu.score)-delta));
      return db.ref('history/'+histId).remove();
    }).then(function(){
      toast('success','ลบสำเร็จ','คะแนนถูกคืนให้นักเรียนแล้ว'); loadHistory();
    }).catch(function(e){ toast('error','เกิดข้อผิดพลาด',e.message); });
  });
}

// ── REPORT ──
function loadReport(){
  showPage('<div class="container"><div class="loading">กำลังโหลด...</div></div>');
  loadStudents(function(students){
    var classMap = {};
    students.forEach(function(s){
      if(!classMap[s.class]) classMap[s.class]=[];
      classMap[s.class].push(s);
    });
    var report = Object.keys(classMap).sort().map(function(cls){
      var list = classMap[cls];
      var avg  = Math.round(list.reduce(function(a,x){return a+Number(x.score);},0)/list.length);
      return {cls:cls, count:list.length, avg:avg,
        above80:list.filter(function(s){return s.score>=80;}).length,
        above60:list.filter(function(s){return s.score>=60&&s.score<80;}).length,
        below60:list.filter(function(s){return s.score<60;}).length,
        students:list.sort(function(a,b){return a.no-b.no;})};
    });

    var h = '<div class="container">';
    h += '<div class="section-header"><h2 style="margin:0">รายงานสรุปคะแนนพฤติกรรม</h2>';
    h += '<div style="display:flex;gap:.5rem"><button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>';
    h += '<button class="btn" onclick="window.print()"><i class="ti ti-printer"></i> พิมพ์</button></div></div>';
    h += '<div class="grid-3" style="margin-bottom:1.25rem">';
    report.forEach(function(c){
      var color = c.avg>=80?'var(--green-600)':c.avg>=60?'var(--yellow-800)':'var(--red-600)';
      h += '<div class="card"><h3>'+c.cls+' <span class="badge badge-blue">'+c.count+' คน</span></h3>';
      h += '<div style="font-size:36px;font-weight:700;color:'+color+';margin-bottom:.25rem">'+c.avg+'</div>';
      h += '<div class="text-muted" style="margin-bottom:.5rem">คะแนนเฉลี่ย</div>';
      h += '<div class="pbar"><div class="pbar-fill" style="width:'+c.avg+'%;background:'+color+'"></div></div>';
      h += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:.4rem">';
      h += '<span style="color:var(--green-600)">≥80: '+c.above80+'</span>';
      h += '<span style="color:var(--yellow-800)">60-79: '+c.above60+'</span>';
      h += '<span style="color:var(--red-600)">&lt;60: '+c.below60+'</span></div></div>';
    });
    h += '</div><div class="card"><h3>รายละเอียดนักเรียน</h3><div class="tab-bar">';
    report.forEach(function(c,i){
      h += '<button class="tbtn'+(i===0?' active':'')+'" onclick="switchTab(\'tr_'+c.cls.replace('/','_')+'\',this)">'+c.cls+'</button>';
    });
    h += '</div>';
    report.forEach(function(c,i){
      h += '<div class="tc'+(i===0?' active':'')+'" id="tr_'+c.cls.replace('/','_')+'"><div class="table-wrap"><table>';
      h += '<thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>คะแนนพฤติกรรม</th><th>คะแนนจิตอาสา</th><th>สถานะ</th></tr></thead><tbody>';
      c.students.forEach(function(s){
        h += '<tr><td>'+s.no+'</td><td>'+s.name+'</td><td>'+scoreBadge(Number(s.score))+'</td><td>'+volunteerBadge(Number(s.volunteer||0))+'</td><td>'+statusBadge(Number(s.score))+'</td></tr>';
      });
      h += '</tbody></table></div></div>';
    });
    h += '</div></div>';
    showPage(h);
  });
}

function switchTab(id, btn){
  document.querySelectorAll('.tbtn').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active');
  document.querySelectorAll('.tc').forEach(function(t){t.classList.remove('active');}); $(id).classList.add('active');
}

function exportCSV(){
  var csv = '\uFEFF' + 'ห้อง,เลขที่,ชื่อ-นามสกุล,คะแนนพฤติกรรม,สถานะ,คะแนนจิตอาสา\n';
  APP.students.forEach(function(s){
    var st = s.score>=80?'ดี':s.score>=60?'ปานกลาง':'ต้องดูแล';
    csv += s.class+','+s.no+',"'+s.name+'",'+s.score+','+st+','+(s.volunteer||0)+'\n';
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = 'คะแนนพฤติกรรม.csv'; a.click();
}

function openImportExcel(){

    title:'นำเข้านักเรียนจาก Excel',

      +'<div style="background:var(--yellow-100);border:1.5px solid var(--yellow-200);border-radius:var(--radius);padding:.75rem 1rem;font-size:13px;color:var(--yellow-800);margin-bottom:1rem">'

      +'(แถวแรกเป็นหัวตาราง แถวที่ 2 เป็นต้นไปเป็นข้อมูล)</div>'
      +'<label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px">เลือกไฟล์ Excel (.xlsx)</label>'
      +'<input type="file" id="excelFile" accept=".xlsx,.xls" style="font-family:Sarabun;width:100%">'
      +'<div id="excelPreview" style="margin-top:1rem"></div>'
      +'</div>',
    confirmButtonText:'<i class="ti ti-upload"></i> นำเข้าข้อมูล',
    confirmButtonColor:'#2980b9',
    showCancelButton:true,
    cancelButtonText:'ยกเลิก',
    didOpen:function(){
      document.getElementById('excelFile').addEventListener('change', function(e){
        var file = e.target.files[0]; if(!file) return;
        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            var wb   = XLSX.read(ev.target.result, {type:'binary'});
            var ws   = wb.Sheets[wb.SheetNames[0]];
            var data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
            var rows = data.slice(1).filter(function(r){ return r[0]&&r[1]&&r[2]; });
            var prev = '<div style="font-size:13px;font-weight:500;margin-bottom:.5rem">พบข้อมูล <span style="color:var(--blue-600)">'+rows.length+' คน</span> ตัวอย่าง:</div>';
            prev += '<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse">';
            prev += '<thead><tr><th style="background:var(--blue-100);padding:5px 8px;text-align:left">เลขที่</th><th style="background:var(--blue-100);padding:5px 8px;text-align:left">ชื่อ-นามสกุล</th><th style="background:var(--blue-100);padding:5px 8px;text-align:left">ห้อง</th></tr></thead><tbody>';
            rows.slice(0,5).forEach(function(r){
              prev += '<tr><td style="padding:4px 8px;border-bottom:1px solid var(--blue-50)">'+r[0]+'</td><td style="padding:4px 8px;border-bottom:1px solid var(--blue-50)">'+r[1]+'</td><td style="padding:4px 8px;border-bottom:1px solid var(--blue-50)">'+r[2]+'</td></tr>';
            });
            if(rows.length>5) prev += '<tr><td colspan="3" style="padding:4px 8px;color:var(--gray-400);text-align:center">... และอีก '+(rows.length-5)+' คน</td></tr>';
            prev += '</tbody></table></div>';
            document.getElementById('excelPreview').innerHTML = prev;
            document.getElementById('excelFile')._parsedRows = rows;
          } catch(err){
            document.getElementById('excelPreview').innerHTML = '<div style="color:var(--red-600);font-size:13px">อ่านไฟล์ไม่ได้: '+err.message+'</div>';
          }
        };
        reader.readAsBinaryString(file);
      });
    },
    preConfirm:function(){
      var el   = document.getElementById('excelFile');
      var rows = el._parsedRows;
      if(!rows||!rows.length){ Swal.showValidationMessage('กรุณาเลือกไฟล์ Excel ก่อน'); return false; }
      return rows;
    }
  }).then(function(r){
    if(!r.isConfirmed) return;
    importExcelData(r.value);
  });
}

function importExcelData(rows){
  Swal.fire({
    title:'กำลังนำเข้าข้อมูล...',
    text:'กรุณารอสักครู่',
    allowOutsideClick:false,
    didOpen:function(){ Swal.showLoading(); }
  });

  // ลบข้อมูลเดิมทั้งหมดก่อน
  db.ref('students').remove().then(function(){
    var updates = {};
    rows.forEach(function(r){
      var no   = String(r[0]).trim();
      var name = String(r[1]).trim();
      var cls  = String(r[2]).trim();
      if(!no||!name||!cls) return;
      var id = makeId(no, cls);
      updates['students/'+id] = {no:Number(no), name:name, class:cls, score:100};
    });
    return db.ref().update(updates);
  }).then(function(){
    Swal.close();
    toast('success','นำเข้าสำเร็จ','นักเรียน '+rows.length+' คน');
    loadStudents(function(){ renderClassGroups(); });
  }).catch(function(e){
    Swal.close();
    toast('error','เกิดข้อผิดพลาด',e.message);
  });
}

// ── EVENT LISTENERS ──
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('stuBtn').addEventListener('click', doStudentLogin);
document.getElementById('stuClass').addEventListener('change', onClassChange);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('roleTeacher').addEventListener('click', function(){ pickRole('teacher'); });
document.getElementById('roleStudent').addEventListener('click', function(){ pickRole('student'); });

// ── INIT ──
loadStudents(function(){});
</script>
</body>
